<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="event.css">

</head>
<body>
    <div class="calculator" >

    <input type="text" id="calculation" readonly>


    <div class="button">
        <button onclick="appendNumber('7')" class="buttons">7</button>
        <button onclick="appendNumber('8')" class="buttons">8</button>
        <button onclick="appendNumber('9')" class="buttons">9</button>
        <button onclick="appendNumber('\\')" class="buttons">\</button>

        <button onclick="appendNumber('4')" class="buttons">4</button>
        <button onclick="appendNumber('5')" class="buttons">5</button>
        <button onclick="appendNumber('6')" class="buttons">6</button>
        <button onclick="appendNumber('*')" class="buttons">*</button>

        <button onclick="appendNumber('1')" class="buttons">1</button>
        <button onclick="appendNumber('2')" class="buttons">2</button>
        <button onclick="appendNumber('3')" class="buttons">3</button>
        <button onclick="appendNumber('-')" class="buttons">-</button>

        <button onclick="appendNumber('0')" class="buttons">0</button>
        <button onclick="clearDisplay()" class="buttons">C</button>
        <button onclick="calculate()" class="buttons">=</button>
        <button onclick="appendNumber('+')" class="buttons">+</button>

    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
